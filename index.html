<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bosque dos Animais: jogo educativo gratuito para crianças de 4 a 12 anos. Matemática, Ciências, História, Inglês e Artes com a Duda, o Gabi e os bichinhos do bosque.">
<meta name="theme-color" content="#FAF5EC">
<meta property="og:title" content="Bosque dos Animais">
<meta property="og:description" content="Jogo educativo gratuito para crianças de 4 a 12 anos. Por Eduarda Normanha.">
<meta property="og:image" content="assets/splash.webp">
<link rel="icon" type="image/png" href="assets/icone-192.png">
<link rel="apple-touch-icon" href="assets/icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style id="standalone">:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Bosque dos Animais</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
<style>
/* Layout: uma coluna sobre fundo bege clarinho chapado; cartões brancos e cores candy (lima, menta, rosa, lavanda, manteiga) como blocos chapados. Um mundo claro só. */
:root{
  color-scheme: light;
  /* Paleta candy, inspirada na referência: cores chapadas, sem degradê */
  --bg:#FAF5EC;                                   /* bege bem clarinho do fundo */
  --lime:#D4F07C; --mint:#A9F0C8; --pink:#F7A8E4; --peri:#A6B0FF; --butter:#FBEA8E; --peach:#FFC29A;
  --royal:#95ABFE; --royal-d:#7C93F0;             /* lavanda-azul dos botões (#95ABFE) */
  --sky:#C9D3FF; --sky2:#F4F1FF;
  --ink:#16132A; --muted:#5F5876; --card:#FFFFFF; --line:#E9D7F0; --soft:#F7F1FA;
  --purple:var(--royal); --purple-d:var(--royal-d); --yellow:var(--butter);
  --good:#1F8F55; --good-bg:#C9F5DB; --bad:#C2482D; --bad-bg:#FFD6CB;
  --mat:var(--pink); --ing:var(--lime); --cie:var(--mint); --his:var(--butter); --art:var(--peri);
  /* Bricolage Grotesque: títulos e botões, grotesca forte como na referência.
     Plus Jakarta Sans: textos, limpa e fácil de ler no celular. */
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --r:22px;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-weight:500;font-size:17px;-webkit-tap-highlight-color:transparent;overflow-x:hidden;background:var(--bg)}
#app{max-width:980px;margin:0 auto;min-height:100%;box-sizing:border-box;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(40px,8vw,72px);font-weight:800;color:var(--ink)}
h2{font-size:clamp(26px,4.5vw,38px);font-weight:800}
h3{font-size:22px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
img{max-width:100%}
.btn{font-family:var(--display);font-weight:700;font-size:17px;padding:10px 22px;min-height:46px;border-radius:999px;background:var(--royal);color:var(--ink);border:2px solid var(--royal);transition:transform .1s,background .15s;letter-spacing:-.005em}
.btn:active{transform:scale(.96)}
.btn[disabled]{background:#DCCDE8;border-color:#DCCDE8;color:#fff;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.ghost:active{transform:scale(.96)}
.foot .btn{min-width:min(128px,38vw)}
.skiprow{display:flex;justify-content:center;margin-top:-6px}
.btn.good{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.bad{background:var(--ink);border-color:var(--ink);color:#fff}
.link{font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:10px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.card{background:var(--card);border-radius:28px;padding:20px}

/* start */
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.fill{min-height:calc(100vh - 32px);min-height:calc(100svh - 32px);margin-bottom:-104px;justify-content:center;box-sizing:border-box;padding-block:12px}
.hero .tag{font-size:19px;color:var(--muted);max-width:30ch}
.crew{display:flex;justify-content:center;align-items:flex-end;gap:0;flex-wrap:nowrap;margin-top:8px}
.crew img{height:clamp(110px,24vw,220px);width:auto;filter:drop-shadow(0 8px 6px rgba(43,35,80,.15));animation:bob 3s ease-in-out infinite}
.crew img.sm{height:clamp(64px,13vw,130px);width:auto;margin:0 -8px}
.crew img:nth-child(2){animation-delay:.4s}.crew img:nth-child(3){animation-delay:.8s}.crew img:nth-child(4){animation-delay:1.2s}.crew img:nth-child(5){animation-delay:1.6s}
@keyframes bob{50%{transform:translateY(-8px)}}

/* Personagem + fala. --ph = altura do personagem, --my = altura da boca (fração da imagem).
   A fala é um balão de mensagem, como no WhatsApp: azul com texto branco, cantos arredondados e
   o canto do lado de quem fala mais "quadradinho". A largura acompanha a quantidade de texto. */
.talk{--ph:clamp(110px,16vw,160px);--my:.4;display:flex;align-items:flex-start;gap:clamp(10px,2vw,16px)}
.talk .prof{height:var(--ph);width:auto;flex:none}
.talk .ph{height:var(--ph);width:auto;aspect-ratio:3/4;flex:none}
.talk .bubble{margin-top:max(8px,calc(var(--ph) * var(--my) - 22px))}
.bubble{position:relative;background:#3659C2;color:#fff;border-radius:20px 20px 20px 20px;border-top-left-radius:6px;padding:11px 16px;text-wrap:balance;font-family:var(--body);font-weight:600;font-size:clamp(16px,1.8vw,18px);line-height:1.38;flex:0 1 auto;width:fit-content;max-width:min(420px,100%);min-width:0;box-sizing:border-box;animation:bubbleIn .35s cubic-bezier(.3,1.4,.5,1) backwards;transform-origin:0 0}
.bubble.tail-down{border-top-left-radius:20px;border-bottom-left-radius:6px;transform-origin:0 100%}
.bubble.tail-up{transform-origin:0 0}
.bubble .tagline{color:#fff}
@keyframes bubbleIn{from{transform:scale(.7);opacity:0}}
.say{float:right;margin:-4px -6px 4px 8px;width:46px;height:46px;border-radius:50%;background:var(--sky2);font-size:22px}
.ph{width:clamp(100px,18vw,160px);aspect-ratio:3/4;flex:none;border-radius:28px;display:grid;place-items:center;font-size:clamp(46px,8vw,70px);color:#fff;position:relative;box-shadow:inset 0 -10px 0 rgba(0,0,0,.12)}
.ph small{position:absolute;bottom:10px;font-size:12px;font-family:var(--body);background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:2px 8px}

/* options */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px}
.opt{background:#fff;border-radius:24px;min-height:76px;padding:12px 14px;font-size:21px;font-family:var(--display);font-weight:700;border:2px solid transparent;transition:transform .1s,background .15s;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;line-height:1.1;color:var(--ink)}
.opt:active{transform:scale(.97)}
.opt .e{font-size:38px;line-height:1}
.opt.emoji{font-size:52px;min-height:110px}
/* tiles: cartões de mesma largura, emoji em cima, respiro igual dos lados; última linha centralizada */
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;--cols:2}
.tiles>.opt{flex:0 0 calc((100% - (var(--cols) - 1) * 12px) / var(--cols));box-sizing:border-box;min-width:0;flex-direction:column;gap:6px;padding:14px 12px;min-height:100px;font-size:clamp(16px,2vw,19px)}
.opt .l{max-width:100%;overflow-wrap:break-word;hyphens:auto}
.tiles[data-n="3"],.tiles[data-n="9"]{--cols:3}
.tiles[data-n="3"]>.opt{padding:16px 10px}
.tiles[data-n="9"]>.opt{min-height:84px;padding:14px 6px;font-size:clamp(21px,5.4vw,26px)} /* "1º ano" maior */
.tiles[data-n="9"] .l.two{font-size:clamp(14px,3.6vw,19px);line-height:1.2} /* os dois textos compridos, em duas linhas */
.tiles[data-n="3"]:not(.long)>.opt:not(.emoji){min-height:96px;font-size:clamp(22px,3vw,28px)}
.tiles.long{--cols:1}
.tiles.long>.opt{min-height:68px;padding:14px 20px}
@media (min-width:640px){
  .tiles[data-n="4"]{--cols:4}
  .tiles[data-n="5"],.tiles[data-n="6"]{--cols:3}
  .tiles.long{--cols:3}
  .tiles.long>.opt{min-height:110px}
}
@media (min-width:1000px){.tiles[data-n="5"]{--cols:5}}
.opt.sel{border-color:var(--ink);background:var(--lime)}
.opt.correct{border-color:var(--ink);background:var(--mint)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
.opt.off{opacity:.45;pointer-events:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ages{grid-template-columns:repeat(auto-fit,minmax(86px,1fr))}
.ages .opt{font-size:40px;min-height:96px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#fff;border-radius:999px;padding:10px 16px;font-weight:600;border:2px solid transparent;min-height:46px;color:var(--ink)}
.chip.sel{border-color:var(--ink);background:var(--lime)}
.topicgroup{display:flex;flex-direction:column;gap:10px}
.topicgroup h3{display:flex;align-items:center;gap:8px}
.chip.none{border-style:dashed;border-color:#C9B2D8}
.chip.none.sel{border-style:solid;border-color:var(--ink)}
.other{font:inherit;font-size:16px;padding:12px 18px;border-radius:999px;border:2px solid #fff;background:#fff;color:var(--ink);width:100%;max-width:440px;box-sizing:border-box}
.other:focus{border-color:var(--ink);outline:none}
/* ajudante lápis ao lado dos campos de escrever */
.write{display:flex;align-items:flex-end;gap:10px;max-width:480px}
.write input{flex:1;min-width:0}
.write .pencil{height:52px;width:auto;flex:none;transform-origin:50% 90%;transition:transform .2s}
.write.big .pencil{height:76px}
.write:focus-within .pencil{animation:scribble .6s ease-in-out infinite}
@keyframes scribble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-3px)}}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}

/* quiz chrome */
.qhead{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:18px;position:relative;background:#fff;border-radius:999px}
/* Barra = corpinho do Lápis-unicórnio: listras finas e inclinadas, em arco-íris vibrante
   (vermelho-rosado, laranja, amarelo, verde, azul, roxo). O progresso revela a barra da esquerda para a direita. */
.bar i{display:block;height:100%;width:100%;
  background:repeating-linear-gradient(115deg,#FF3D6E 0 7px,#FF8A1F 7px 14px,#FFD21F 14px 21px,#5BD13B 21px 28px,#1E9BFF 28px 35px,#8B4DFF 35px 42px);
  box-shadow:inset 0 5px 0 rgba(255,255,255,.28),inset 0 -4px 0 rgba(0,0,0,.10);
  clip-path:inset(0 calc(100% - var(--p,0%)) 0 0 round 999px);transition:clip-path .4s}
.snd{width:48px;height:48px;border-radius:50%;background:#fff;font-size:22px;flex:none;display:grid;place-items:center}
.snd:active{transform:scale(.94)}
#app{position:relative}
.corner{position:absolute;top:16px;right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.x{width:48px;height:48px;border-radius:50%;background:#fff;font-size:22px;flex:none;color:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* avatar picker */
.avs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 6px;--cols:3}
.avs>.av{flex:0 0 calc((100% - (var(--cols) - 1) * 6px) / var(--cols));box-sizing:border-box;min-width:0}
@media (min-width:1000px){.avs{--cols:6}}
/* avatares soltos, sem caixa: sombra no chão + nome em etiqueta; selecionado = chão roxo + etiqueta roxa */
.av{position:relative;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--display);font-size:clamp(15px,4vw,19px);font-weight:700;color:var(--ink)}
.av::before{content:"";position:absolute;left:18%;right:18%;top:calc(4px + clamp(84px,24vw,120px) - 14px);height:16px;border-radius:50%;background:rgba(43,35,80,.12);transition:background .2s}
.av img{position:relative;height:clamp(84px,24vw,120px);width:auto;object-fit:contain;transition:transform .2s}
.av .nm{padding:3px 12px;border-radius:999px;line-height:1.3}
.av:hover img{transform:translateY(-3px)}
.av.sel::before{background:var(--ink);opacity:.22}
.av.sel img{transform:scale(1.08) translateY(-4px)}
.av.sel .nm{background:var(--ink);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;max-width:420px}
.field input{font:inherit;font-size:20px;padding:14px 20px;border-radius:999px;border:2px solid #fff;background:#fff;color:var(--ink);min-width:0}
.field input:focus{border-color:var(--ink);outline:none}

/* top bar */
.top{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 6px 6px 6px}
.top .me{width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;overflow:hidden;flex:none}
.top .me img{height:48px;width:auto}
.top .nm{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .nm small{display:block;font-family:var(--body);font-size:13px;color:var(--muted)}
.pill{background:var(--butter);border-radius:999px;padding:8px 14px;font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.top .btn{font-size:15px;padding:6px 14px;min-height:40px}
.top .snd{background:var(--soft)}

/* map */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:18px}
.lv{background:var(--c,#fff);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;text-align:left;transition:transform .1s;color:var(--ink)}
.lv:active{transform:scale(.98)}
.lv .art{height:150px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px;position:relative}
.lv .art img{height:160px;width:auto;margin-bottom:-12px;align-self:flex-end}
.lv .art .big{font-size:64px;align-self:center}
.lv .art .ph{width:96px;font-size:44px;border-radius:22px;align-self:flex-end;margin-bottom:-8px;box-shadow:none;background:rgba(255,255,255,.25)}
.lv .info{padding:12px 20px 20px;display:flex;flex-direction:column;gap:6px}
.lv .info h3{font-size:26px}
.lv .row2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.lv .play{border:2px solid var(--ink);border-radius:999px;padding:6px 16px;font-family:var(--display);font-weight:700;font-size:16px}
.lv .info p{color:var(--ink);opacity:.75;font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap;position:absolute;top:12px;left:12px}
.tg{background:#fff;color:var(--ink);font-size:13px;font-weight:700;border-radius:999px;padding:5px 11px}
.stars{font-size:20px;letter-spacing:2px}
.lv.locked{background:#fff}
.lv.locked .art{background:transparent}
.lv.locked .art .big{animation:wiggle 2.4s ease-in-out infinite;margin:auto}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-10deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}
.plan{display:flex;flex-direction:column;gap:8px}
.plan .chips .chip{font-size:14px;min-height:0;padding:6px 12px;background:var(--soft)}

/* lesson */
.qcard{display:flex;flex-direction:column;gap:18px}
.visual{font-size:clamp(46px,9vw,76px);text-align:center;line-height:1.15;letter-spacing:4px;word-break:break-word}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(110%);transition:transform .25s ease-out}
.fb.show{transform:none}
.fb.good{background:var(--mint)}.fb.bad{background:var(--peach)}
.fb .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.fb .msg{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.fb .msg b{font-family:var(--display);font-size:26px;display:block}
.fb.good .msg b{color:var(--ink)}.fb.bad .msg b{color:var(--ink)}
.fb .msg span{font-size:16px}
.fb .face{font-size:44px}
.hint{background:var(--butter);border-radius:20px;padding:12px 16px;font-size:17px}

/* modal */
#modal{position:fixed;inset:0;z-index:40;background:rgba(22,19,42,.45);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
#modal .box{background:#fff;border-radius:32px;padding:26px 22px;max-width:460px;width:100%;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.gift{font-size:110px;line-height:1;animation:wiggle 1.6s ease-in-out infinite}
.reward{font-size:80px;line-height:1}

/* house */
.room{position:relative;border-radius:32px;overflow:hidden;min-height:380px;background:linear-gradient(180deg,#F8E9FC 0 64%,var(--butter) 64% 100%)}
.room .win{position:absolute;top:24px;left:24px;width:110px;height:90px;border-radius:20px;background:var(--sky);border:6px solid #fff}
.room .shelf{position:absolute;top:40px;right:20px;left:150px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.room .shelf span{font-size:40px;background:#fff;border-radius:16px;padding:4px 8px}
.room .rug{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:62%;height:44px;border-radius:50%;background:var(--pink)}
.room .me{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);height:240px;width:auto;cursor:pointer;filter:drop-shadow(0 8px 6px rgba(0,0,0,.18))}
.room .me.jump{animation:jump .5s}
@keyframes jump{50%{transform:translateX(-50%) translateY(-40px)}}
.room .floor{position:absolute;bottom:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;max-width:30%}
.room .floor span{font-size:38px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.novoice .say{display:none}
/* ilustrações */
.ic{display:inline-block;vertical-align:middle;flex:none;overflow:visible}
.ic.sm *:not([stroke-width]){stroke-width:4.5}
.ic.chev *{stroke-width:9}
.btn .ic,.chip .ic,.tg .ic,.pill .ic,.legend .ic,h3 .ic,h2 .ic,.play .ic{margin-top:-3px}
.btn .chev,.btn .chev *,.play .chev *{stroke:currentColor}
.opt .e{line-height:0}
.opt .e .ic{width:44px;height:44px}
.legend{color:var(--muted);display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.lv .art .badge{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;align-self:center}
.stars{display:inline-flex;gap:2px}
.bigstars{display:flex;gap:8px;justify-content:center}
.room .shelf span{line-height:0}
/* splash */
.splash{min-height:calc(100vh - 32px);min-height:calc(100svh - 32px);margin-bottom:-104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;cursor:pointer}
.splash .logo{width:min(720px,100%);max-height:62vh;object-fit:contain;height:auto;filter:drop-shadow(0 14px 12px rgba(43,35,80,.18));animation:logoIn 1.1s cubic-bezier(.3,1.6,.5,1) backwards}
.splash .by{font-family:var(--display);font-weight:600;font-size:clamp(18px,3vw,24px);color:var(--muted);animation:fadeUp .7s 1s backwards}
.splash .by b{color:var(--ink);font-weight:800}
.splash .tap{font-size:15px;color:var(--muted);animation:fadeUp .6s 2.2s backwards}
@keyframes logoIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}60%{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
/* splash: Duda e Gabi em pé logo abaixo da plaquinha */
@keyframes popIn{from{transform:translateY(30px) scale(.6);opacity:0}}
/* tela inicial: só os bichinhos (gato e leão nas pontas) */
.pets{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:4px 0;max-width:100%}
.pets img{height:clamp(104px,27vw,190px);width:auto;margin:0 clamp(-12px,-1.2vw,-4px);filter:drop-shadow(0 8px 6px rgba(43,35,80,.16));animation:bob 2.6s ease-in-out infinite}
@media (min-width:600px){.pets{flex-wrap:nowrap}.pets img{height:min(180px,calc((100vw - 220px) / 6))}}
.pets img:nth-child(2){animation-delay:.3s}.pets img:nth-child(3){animation-delay:.6s}.pets img:nth-child(4){animation-delay:.9s}.pets img:nth-child(5){animation-delay:1.2s}.pets img:nth-child(6){animation-delay:1.5s}
.tagline{font-size:clamp(20px,3.6vw,28px);color:var(--ink);max-width:18ch;text-align:left;line-height:1.15}
/* tela inicial: balão em cima, Lápis centralizado embaixo */
.pencil-talk{display:flex;flex-direction:column;align-items:center;gap:22px;max-width:640px}
.pencil-big{height:clamp(150px,min(30vh,44vw),240px);width:auto;flex:none;filter:drop-shadow(0 10px 8px rgba(43,35,80,.18));animation:bob 3s ease-in-out infinite;transform-origin:50% 90%}
.pencil-talk .bubble{margin:0;padding:clamp(16px,3vw,26px) clamp(20px,3.6vw,32px);animation-delay:.2s}
.pencil-talk .tagline{text-align:center;max-width:20ch}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){
  .talk{--ph:clamp(104px,28vw,128px)}
  .ph{width:110px}
  .bubble{font-size:16px;padding:10px 14px}
  .room .me{height:190px}
  .room .shelf{left:20px;top:130px;justify-content:center}
}

function clean(t){return String(t).replace(/[\p{Extended_Pictographic}️‍➕❓➡️]/gu," ").replace(/_{2,}/g,"…").replace(/\s+/g," ").trim()}
function speak(parts){
  if(!VOICE||!("speechSynthesis" in window))return;
  try{speechSynthesis.cancel();
  parts.forEach(([t,lang])=>{t=clean(t);if(!t)return;const u=new SpeechSynthesisUtterance(t);u.lang=lang;
    const v=voices.find(v=>v.lang===lang)||voices.find(v=>v.lang&&v.lang.startsWith(lang.slice(0,2)));if(v)u.voice=v;
    u.rate=lang.startsWith("en")?.85:1;u.pitch=1.1;speechSynthesis.speak(u)})}catch(e){}
}

const SND_KEY="bosque-sons";

let actx=null;
function ac(){
  if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C()}
  if(actx.state==="suspended")actx.resume();
  return actx;
}
function tone(f,t0,d,{type="sine",vol=.18,to=null}={}){
  const c=ac();if(!c)return;const t=c.currentTime+t0;
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03);
}
const NT={G4:392,C5:523.25,E5:659.25,G5:783.99,A5:880,C6:1046.5,E6:1318.5,G6:1568};
const SFX={
  tap:  ()=>tone(520,0,.07,{type:"triangle",vol:.11,to:780}),                        // botões
  pick: ()=>{tone(NT.E5,0,.09,{type:"triangle",vol:.13});tone(NT.A5,.07,.12,{type:"triangle",vol:.13})}, // escolher opção
  boing:()=>tone(220,0,.26,{type:"sine",vol:.22,to:660}),                            // escolher bichinho
  right:()=>[NT.C5,NT.E5,NT.G5,NT.C6].forEach((f,i)=>tone(f,i*.07,.2,{type:"triangle",vol:.16})), // acertou
  wrong:()=>{tone(330,0,.16,{type:"sine",vol:.13,to:250});tone(250,.14,.24,{type:"sine",vol:.11,to:190})}, // errou (fofo, sem susto)
  gift: ()=>[NT.G5,NT.C6,NT.E6,NT.G6,NT.E6,NT.G6].forEach((f,i)=>tone(f,i*.06,.15,{type:"sine",vol:.1})), // presente
  win:  ()=>{[NT.C5,NT.E5,NT.G5,NT.C6].forEach((f,i)=>tone(f,i*.12,.16,{type:"square",vol:.05}));tone(NT.C6,.5,.6,{type:"triangle",vol:.16});tone(NT.E6,.5,.6,{type:"triangle",vol:.09})}, // nível completo
  hello:()=>[NT.G4,NT.C5,NT.E5,NT.G5].forEach((f,i)=>tone(f,i*.09,.22,{type:"triangle",vol:.14})), // entrar no jogo
  pop:  ()=>tone(300,0,.12,{type:"sine",vol:.15,to:900}),
};

    case "ano": body=`<div class="opts tiles" data-n="9">${ANOS.map(a=>`<button class="opt ${S.ano===a?"sel":""}" data-v="${a}"><span class="l ${ANO_LABEL[a]?"two":""}">${ANO_LABEL[a]||a}</span></button>`).join("")}</div>`; canNext=!!S.ano; break;

    case "fav": body=subjOpts(S.fav); canNext=!!S.fav; break;
    case "hard": body=subjOpts(S.hard,["nenhuma","cool","Nenhuma, tô de boa!"]); canNext=!!S.hard; break;
    case "why": body=listOpts(WHY_OPTS,S.why); canNext=!!S.why; break;
    case "school": body=SUBJ_IDS.map(id=>`<div class="topicgroup"><h3>${ic(id,30)} ${SUBJ[id].name}</h3><div class="chips">${[...TOPICS[id][faixa()],NONE].map(t=>`<button class="chip ${t===NONE?"none":""} ${(S.school[id]||[]).includes(t)?"sel":""}" data-sub="${id}" data-t="${esc(t)}">${t===NONE?ic("none",20)+" Nenhuma dessas":esc(t)}</button>`).join("")}</div>${writeBox(`<input class="other" id="other-${id}" data-other="${id}" maxlength="60" autocomplete="off" placeholder="Outra coisa? Escreva aqui" aria-label="Outra coisa que está aprendendo em ${SUBJ[id].name}" value="${esc(S.schoolOther[id]||"")}">`)}</div>`).join("")+`<p style="color:var(--muted)">Não sabe? Tudo bem, pode pular!</p>`; canNext=true; break;
    case "chosen":
      if(S.chosen.length>1)S.chosen=S.chosen.slice(0,1); // regra: começa com uma matéria só
      body=`<div class="opts tiles" data-n="5">${SUBJ_IDS.map(id=>{const on=S.chosen.includes(id);return `<button class="opt ${on?"sel":""}" data-v="${id}"><span class="e">${ic(on?id:"gift",56)}</span><span class="l">${SUBJ[id].name}${id===S.hard?" "+ic("bolt",20):""}${id===S.fav?" "+ic("heart",20):""}</span></button>`}).join("")}</div><p class="legend">${ic("bolt",20)} reforço ${ic("heart",20)} favorita ${ic("gift",20)} vira surpresa</p>`;
      canNext=S.chosen.length>0; break;
    case "pais":
      if(!gateOk){
        body=`<div class="card center"><h3>${ic("lock",28)} Só para adultos</h3><p>Quanto é 6 × 7?</p><div class="row" style="justify-content:center"><input id="gate" inputmode="numeric" maxlength="3" style="font:inherit;font-size:28px;width:110px;text-align:center;padding:10px;border-radius:16px;border:3px solid var(--line)" aria-label="Resposta"><button class="btn" id="gatebtn">OK</button></div><p id="gatemsg" style="color:var(--bad)"></p></div>`;
      }else{
        body=`<div class="card" style="display:flex;flex-direction:column;gap:14px">
          <h3>Tem alguma prova ou trabalho chegando?</h3>
          <div class="chips">${[...SUBJ_IDS,"nao"].map(id=>`<button class="chip ${S.prova===id?"sel":""}" data-prova="${id}">${id==="nao"?"Não":ic(id,20)+" "+SUBJ[id].name}</button>`).join("")}</div>
          <h3>Quanto tempo por dia a criança pode jogar?</h3>
          <div class="chips">${["10 min","20 min","30 min"].map(t=>`<button class="chip ${S.tempo===t?"sel":""}" data-tempo="${t}">${t}</button>`).join("")}</div></div>`;
      }
      canNext=true; break;
  }
  const pct=Math.round(qi/st.length*100);
  app.innerHTML=`<div class="qhead"><div class="bar" style="--p:${pct}%"><i></i></div>${soundBtn()}</div>
    ${talk(s.prof,text,SUBJ[s.prof].prof.name)}
    ${body}
    <div class="foot"><button class="btn ghost" data-back>${PV} Voltar</button><button class="btn" id="next" ${canNext?"":"disabled"}>${qi===st.length-1?"Pronto!":"Continuar "+NX}</button></div>
    ${s.id==="pais"||s.id==="school"?`<div class="skiprow"><button class="link" id="skip">Pular esta pergunta</button></div>`:""}`;
  if(faixa()==="p"||qi===0)setTimeout(()=>speak([[text,"pt-BR"]]),250);
  app.querySelectorAll(".opt[data-v]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.v;
    if(s.id==="age"){S.age=+v}
    else if(s.id==="chosen"){S.chosen=[v]}
    else S[s.id]=v;
    if(s.id==="hard"&&v==="nenhuma")S.why=null;
    save();Quiz();
  });
  app.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.sub,t=b.dataset.t;let arr=S.school[id]||[];
    if(t===NONE)arr=arr.includes(NONE)?[]:[NONE];
    else{arr=arr.filter(x=>x!==NONE);arr=arr.includes(t)?arr.filter(x=>x!==t):[...arr,t]}
    S.school[id]=arr;save();
    app.querySelectorAll(`[data-sub="${id}"]`).forEach(c=>c.classList.toggle("sel",arr.includes(c.dataset.t)));
  });
  app.querySelectorAll("[data-other]").forEach(i=>i.oninput=()=>{S.schoolOther[i.dataset.other]=i.value.trim();save()});
  app.querySelectorAll("[data-prova]").forEach(b=>b.onclick=()=>{S.prova=b.dataset.prova;save();Quiz()});
  app.querySelectorAll("[data-tempo]").forEach(b=>b.onclick=()=>{S.tempo=b.dataset.tempo;save();Quiz()});
  const gb=$("#gatebtn"); if(gb){const tryGate=()=>{if($("#gate").value.trim()==="42"){gateOk=true;Quiz()}else{$("#gatemsg").textContent="Hmm, não é isso. Peça ajuda a um adulto!"}};gb.onclick=tryGate;$("#gate").onkeydown=e=>{if(e.key==="Enter")tryGate()}}
  $("[data-back]").onclick=()=>{if(qi===0)go("avatar");else{qi--;Quiz()}};
  $("#next").onclick=()=>{qi++;Quiz()};
  const sk=$("#skip");if(sk)sk.onclick=()=>{qi++;Quiz()};
}
function finishQuiz(){
  S.quizDone=true;S.unlocked=[...S.chosen];save();gateOk=false;confetti();go("map");
}

/* ---- MAP ---- */
function order(){
  const pri=id=>(id===S.hard?0:id===S.prova?1:id===S.fav?2:3);
  const open=S.unlocked.slice().sort((a,b)=>pri(a)-pri(b));
  return [...open,...SUBJ_IDS.filter(id=>!S.unlocked.includes(id))];
}
function MapS(){
  if(!S.quizDone){go("start");return}
  const cards=order().map(id=>{
    const sj=SUBJ[id];
    if(!S.unlocked.includes(id))return `<div class="lv locked"><div class="art"><span class="big">${ic("gift",88)}</span></div><div class="info"><h3>Surpresa!</h3><p>Pode aparecer no meio de um nível…</p></div></div>`;
    const pr=S.progress[id]||{};const st=pr.stars||0;
    const tags=[id===S.hard?ic("bolt",18)+" Reforço":"",id===S.prova?ic("note",18)+" Revisão p/ prova":"",id===S.fav?ic("heart",18)+" Favorita":""].filter(Boolean);
    return `<button class="lv" data-lv="${id}" style="--c:${sj.color}"><div class="art"><div class="tags">${tags.map(t=>`<span class="tg">${t}</span>`).join("")}</div>${sj.prof.img?`<span class="big badge">${ic(id,52)}</span>`:"<span></span>"}${profArt(id,"")}</div>
      <div class="info"><h3>${sj.name}</h3><p>com ${sj.prof.art?(sj.prof.art==="a"?"a professora ":"o professor "):""}${esc(sj.prof.name)}</p><div class="row2"><span class="stars" aria-label="${st} de 3 estrelas">${starsRow(st)}</span><span class="play">Jogar ${NX}</span></div></div></button>`;
  }).join("");
  const sch=SUBJ_IDS.flatMap(id=>[...(S.school[id]||[]).filter(t=>t!==NONE),...(S.schoolOther[id]?[S.schoolOther[id]]:[])].map(t=>`<span class="chip">${ic(id,18)} ${esc(t)}</span>`));
  app.innerHTML=`${topbar()}
    ${talk(S.hard&&S.hard!=="nenhuma"&&S.unlocked.includes(S.hard)?S.hard:"mat",greet(),"")}
    <div class="levels">${cards}</div>
    ${sch.length?`<div class="card plan"><h3>Na escola você está vendo</h3><div class="chips">${sch.join("")}</div></div>`:""}`;
  app.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>startLevel(b.dataset.lv));
}
function greet(){
  const n=S.name||av().name;
  if(S.hard&&S.hard!=="nenhuma"&&S.unlocked.includes(S.hard)&&!(S.progress[S.hard]?.stars))return `Oi, ${n}! Que tal começar pelo reforço de ${SUBJ[S.hard].name}? Eu te ajudo!`;
  return `Oi, ${n}! Escolha uma matéria para jogar.`;
}

/* ---- LESSON ---- */
let L=null;
function startLevel(id){
  const bank=Q[id][faixa()];
  L={subj:id,mode:"main",queue:shuffle(bank).map(q=>({q,tries:0})),pos:0,done:0,total:bank.length,wrong:0,giftShown:false,introFor:id,sq:null,spos:0,sdone:0,sSubj:null};
  go("intro");
}
function Intro(){
  const id=L.introFor, sj=SUBJ[id], surprise=L.mode==="surprise";
  const reforco=!surprise&&id===S.hard;
  // Cada professor diz o próprio nome só na primeira vez que aparece (Duda e Gabi já se apresentam no quiz)
  const met=(S.met||[]).includes(id)||((id==="mat"||id==="ing")&&S.quizDone);
  const p=sj.prof, who=p.art==="a"?"sua professora":"seu professor";
  const hi=met?`Oi de novo!`:`Oi! Eu sou ${p.art==="a"?"a "+p.name+", ":p.art==="o"?"o "+p.name+", ":""}${who} de ${sj.name}.`;
  const msg=surprise?(met?`Surpresa! Uma aula rapidinha de ${sj.name}. Vamos?`:`Surpresa! ${hi.slice(4)} Vamos fazer uma aula rapidinha?`)
    :reforco?`${hi} Vamos treinar ${met?sj.name+" ":""}juntos, sem pressa. Se precisar, toque na lâmpada para pedir uma dica!`
    :`${hi} Vamos aprender ${met?sj.name+" ":""}juntos?`;
  if(!met){S.met=[...(S.met||[]),id];save()}
  app.innerHTML=`<div class="center fill">
    <div style="display:grid;place-items:center">${sj.prof.img?`<img src="${sj.prof.img}" alt="${esc(sj.prof.name)}" style="height:min(230px,32vh);animation:bob 3s ease-in-out infinite">`:`<div class="ph" style="background:${sj.color};width:180px;font-size:80px">${ic(id,96)}<small>professor em breve</small></div>`}</div>
    <div class="bubble tail-up" style="margin:4px 0 0"><button class="say" data-say="${esc(msg)}" aria-label="Ouvir">🔊</button><span class="tx">${esc(msg)}</span></div>
    <button class="btn" id="go">Vamos! ${NX}</button></div>`;
  setTimeout(()=>speak([[msg,"pt-BR"]]),300);
  $("#go").onclick=()=>go("lesson");
}
function cur(){return L.mode==="main"?L.queue[L.pos]:L.sq[L.spos]}
function Lesson(){
  const id=L.mode==="main"?L.subj:L.sSubj, sj=SUBJ[id], it=cur(), [text,opts,dica,visual,en]=it.q;
  const reforco=L.mode==="main"&&id===S.hard;
  const pct=L.mode==="main"?Math.round(L.done/L.total*100):Math.round(L.sdone/L.sq.length*100);
  if(!it.order)it.order=shuffle(opts);
  const emo=it.order.every(o=>isEmoji(o));
  app.innerHTML=`<div class="qhead"><button class="x" id="quit" aria-label="Sair">✕</button><div class="bar" style="--p:${pct}%"><i></i></div>${soundBtn()}${L.mode==="surprise"?`<span class="pill">${ic("gift",24)}</span>`:""}</div>
    <div class="qcard">
      <div class="talk" style="${talkVars(id)}">${profArt(id)}<div class="bubble"><button class="say" id="sayq" aria-label="Ouvir">🔊</button><span class="tx">${esc(text)}</span></div></div>
      ${visual?`<div class="visual" aria-hidden="true">${visual}</div>`:""}
      <div class="opts tiles ${!emo&&it.order.some(o=>o.length>8)?"long":""}" data-n="${it.order.length}">${it.order.map((o,i)=>`<button class="opt ${emo?"emoji":""}" data-i="${i}"><span class="l">${esc(o)}</span></button>`).join("")}</div>
      ${reforco?`<div><button class="btn ghost" id="hintbtn">${ic("bulb",22)} Dica</button></div><p class="hint" id="hint" hidden>${esc(dica)}</p>`:""}
    </div>
    <div class="fb" id="fb"></div>`;
  const sayIt=()=>speak([[text,"pt-BR"],...(en?[[en,"en-US"]]:[])]);
  $("#sayq").onclick=sayIt;
  if(faixa()==="p"||S.style==="ouvindo")setTimeout(sayIt,250);
  $("#quit").onclick=()=>{modal(`<div class="reward">${ic("sad",96)}</div><h2>Quer mesmo sair?</h2><p>Você vai perder o progresso deste nível.</p><div class="row" style="justify-content:center"><button class="btn" id="stay">Continuar jogando</button><button class="btn ghost" id="leave">Sair</button></div>`);$("#stay").onclick=closeModal;$("#leave").onclick=()=>{closeModal();go("map")}};
  const hb=$("#hintbtn");if(hb)hb.onclick=()=>{$("#hint").hidden=false;speak([[dica,"pt-BR"]])};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,it));
}
function answer(btn,it){
  const right=it.order[+btn.dataset.i]===it.q[1][0];
  const sj=SUBJ[L.mode==="main"?L.subj:L.sSubj];
  const soft=S.why==="nervoso"&&L.subj===S.hard;
  const fb=$("#fb");
  if(right){
    app.querySelectorAll(".opt").forEach(b=>b.classList.add("off"));btn.classList.remove("off");btn.classList.add("correct");
    const praise=["Muito bem!","Isso aí!","Arrasou!","Perfeito!","Mandou bem!"][Math.floor(Math.random()*5)];
    fb.className="fb good show";fb.innerHTML=`<div class="in"><div class="msg"><span class="face">${ic("happy",56)}</span><div><b>${praise}</b><span>${esc(sj.prof.name)} ficou feliz!</span></div></div><button class="btn good" id="cont">Continuar ${NX}</button></div>`;
    speak([[praise,"pt-BR"]]);sfx("right");
    $("#cont").onclick=()=>advance(true);
  }else{
    it.tries++; if(L.mode==="main")L.wrong++;sfx("wrong");
    btn.classList.add("wrong");
    if(faixa()==="p"){
      // Pequenos: tenta de novo na mesma pergunta, com dica falada
      btn.classList.add("off");
      fb.className="fb bad show";fb.innerHTML=`<div class="in"><div class="msg"><span class="face">${ic("heartface",56)}</span><div><b>Quase!</b><span>${esc(it.q[2])}</span></div></div><button class="btn bad" id="cont">Tentar de novo</button></div>`;
      speak([["Quase! "+it.q[2],"pt-BR"]]);
      $("#cont").onclick=()=>{fb.className="fb"};
    }else{
      app.querySelectorAll(".opt").forEach(b=>{b.classList.add("off");if(it.order[+b.dataset.i]===it.q[1][0]){b.classList.remove("off");b.classList.add("correct")}});
      btn.classList.remove("off");
      fb.className="fb bad show";fb.innerHTML=`<div class="in"><div class="msg"><span class="face">${ic("heartface",56)}</span><div><b>${soft?"Tudo bem errar!":"Quase!"}</b><span>${esc(it.q[2])} A resposta é <b style="display:inline;font-size:inherit">${esc(it.q[1][0])}</b>.</span></div></div><button class="btn bad" id="cont">Entendi ${NX}</button></div>`;
      speak([[(soft?"Tudo bem errar! ":"Quase! ")+it.q[2],"pt-BR"]]);
      $("#cont").onclick=()=>advance(false);
    }
  }
}
function advance(right){
  if(L.mode==="surprise"){
    if(right){L.sdone++;L.spos++}else{L.sq.push(Object.assign({},L.sq[L.spos],{order:null}));L.spos++}
    if(L.sdone>=L.sq.length){finishSurprise();return}
    render();return;
  }
  if(right){L.done++;L.pos++}else{L.queue.push({q:L.queue[L.pos].q,tries:0});L.pos++}
  if(L.done>=L.total){finishLevel();return}
  if(!L.giftShown&&L.done>=Math.ceil(L.total/2)){L.giftShown=true;showGift();return}
  render();
}
function showGift(){
  const locked=SUBJ_IDS.filter(id=>!S.unlocked.includes(id));
  confetti();sfx("gift");
  if(!locked.length){
    const b=nextBonus();
    modal(`<div class="gift">${ic("gift",110)}</div><h2>Presente surpresa!</h2><p>Você já tem todas as matérias. Então ganhou um presente para sua casa:</p><div class="reward">${ic(b[0],88)}</div><h3>${b[1]}</h3><button class="btn" id="ok">Oba! Continuar ${NX}</button>`);
    speak([["Presente surpresa! Você ganhou: "+b[1],"pt-BR"]]);
    $("#ok").onclick=()=>{closeModal();render()};return;
  }
  const pick=locked[Math.floor(Math.random()*locked.length)];
  modal(`<div class="gift">${ic("gift",110)}</div><h2>Presente surpresa!</h2><p>Você está na metade do nível! Dentro do presente tem uma aula nova de <b>${SUBJ[pick].name}</b>. Se completar, essa matéria fica liberada!</p><div class="row" style="justify-content:center"><button class="btn" id="open">Abrir!</button><button class="btn ghost" id="later">Agora não</button></div>`);
  speak([["Presente surpresa! Quer abrir uma aula nova de "+SUBJ[pick].name+"?","pt-BR"]]);
  $("#open").onclick=()=>{closeModal();L.mode="surprise";L.sSubj=pick;L.sq=shuffle(Q[pick][faixa()]).slice(0,3).map(q=>({q,tries:0}));L.spos=0;L.sdone=0;L.introFor=pick;go("intro")};
  $("#later").onclick=()=>{closeModal();render()};
}
function nextBonus(){const b=BONUS.find(x=>!S.items.includes(x[0]))||BONUS[Math.floor(Math.random()*BONUS.length)];S.items.push(b[0]);save();return b}
function finishSurprise(){
  const id=L.sSubj;S.unlocked.push(id);S.stars+=3;const b=nextBonus();save();confetti();
  modal(`<div class="reward">${ic(id,88)}</div><h2>${SUBJ[id].name} liberada!</h2><p>Agora ${esc(SUBJ[id].prof.name)} também é seu professor. E você ganhou um presente para a casa:</p><div class="reward">${ic(b[0],88)}</div><h3>${b[1]} · +3 estrelas</h3><button class="btn" id="ok">Voltar para ${SUBJ[L.subj].name} ${NX}</button>`);
  speak([[SUBJ[id].name+" liberada! Você ganhou: "+b[1],"pt-BR"]]);
  $("#ok").onclick=()=>{closeModal();L.mode="main";go("lesson")};
}
let lastEnd=null;
function finishLevel(){
  const id=L.subj;const stars=L.wrong===0?3:L.wrong<=2?2:1;
  const pr=S.progress[id]||{stars:0,plays:0};const first=!pr.plays;
  pr.stars=Math.max(pr.stars,stars);pr.plays++;S.progress[id]=pr;S.stars+=stars*2;
  let item=null;if(first&&!S.items.includes(SUBJ[id].item[0])){S.items.push(SUBJ[id].item[0]);item=SUBJ[id].item}
  save();lastEnd={id,stars,item};go("end");
}
function End(){
  const {id,stars,item}=lastEnd, sj=SUBJ[id];
  app.innerHTML=`<div class="center fill">
    <div style="display:flex;align-items:flex-end;gap:8px;justify-content:center">${sj.prof.img?`<img src="${sj.prof.img}" alt="" style="height:min(220px,30vh)">`:""}<img src="${av().img}" alt="" style="height:min(170px,24vh);animation:bob 2s ease-in-out infinite"></div>
    <h2>Nível de ${sj.name} completo!</h2>
    <div class="bigstars">${starsRow(stars,60)}</div>
    <p class="pill">${ic("star",22)} +${stars*2} estrelas</p>
    ${item?`<div class="card center"><p>Novo item para sua casa:</p><div class="reward">${ic(item[0],88)}</div><h3>${item[1]}</h3></div>`:""}
    <div class="row" style="justify-content:center"><button class="btn" data-go="map">Voltar ao mapa</button><button class="btn ghost" data-go="casa">${ic("house",22)} Ver minha casa</button></div></div>`;
  confetti();sfx("win");speak([["Parabéns! Você completou o nível de "+sj.name,"pt-BR"]]);
}

/* ---- CASA ---- */

    <h3>Trocar de bichinho</h3>
    <div class="avs">${AVATARS.map(x=>`<button class="av ${S.avatar===x.id?"sel":""}" data-sw="${x.id}"><img src="${x.img}" alt=""><span class="nm">${x.name}</span></button>`).join("")}</div>
    <div class="foot"><button class="btn" data-go="map">← Voltar ao mapa</button><button class="link" data-go="pais">${ic("lock",20)} Área dos pais</button></div>`;
  $("#me").onclick=e=>{e.target.classList.remove("jump");void e.target.offsetWidth;e.target.classList.add("jump");speak([["Oi, "+(S.name||a.name)+"!","pt-BR"]])};
  app.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{S.avatar=b.dataset.sw;save();Casa()});
}

/* ---- PAIS ---- */
let paisOk=false;
function Pais(){
  if(!paisOk){
    app.innerHTML=`<div class="card center" style="margin-top:30px"><h2>${ic("lock",34)} Área dos pais</h2><p>Quanto é 6 × 7?</p><div class="row" style="justify-content:center"><input id="g2" inputmode="numeric" maxlength="3" aria-label="Resposta" style="font:inherit;font-size:28px;width:110px;text-align:center;padding:10px;border-radius:16px;border:3px solid var(--line)"><button class="btn" id="g2b">OK</button></div><p id="g2m" style="color:var(--bad)"></p><button class="link" data-go="casa">← Voltar</button></div>`;
    const t=()=>{if($("#g2").value.trim()==="42"){paisOk=true;Pais()}else $("#g2m").textContent="Resposta incorreta."};
    $("#g2b").onclick=t;$("#g2").onkeydown=e=>{if(e.key==="Enter")t()};return;
  }
  const nm=id=>id&&SUBJ[id]?SUBJ[id].name:(id==="nenhuma"?"Nenhuma":id==="nao"?"Não":"—");
  const why=(WHY_OPTS.find(w=>w[0]===S.why)||[])[2]||"—";
  const style=(STYLE_OPTS.find(w=>w[0]===S.style)||[])[2]||"—";
  app.innerHTML=`<h2>Área dos pais</h2>
    <div class="card"><dl class="kv">
      <dt>Idade</dt><dd>${S.age||"—"} anos · ${FAIXA[faixa()]}</dd>
      <dt>Ano escolar</dt><dd>${esc(S.ano||"—")}</dd>
      <dt>Aprende melhor</dt><dd>${style}</dd>
      <dt>Favorita</dt><dd>${nm(S.fav)}</dd>
      <dt>Reforço</dt><dd>${nm(S.hard)}${S.why?" · "+why:""}</dd>
      <dt>Prova chegando</dt><dd>${nm(S.prova)}</dd>
      <dt>Tempo por dia</dt><dd>${S.tempo||"—"}</dd>
      <dt>Matérias liberadas</dt><dd>${S.unlocked.map(nm).join(", ")}</dd>
      <dt>Na escola</dt><dd>${SUBJ_IDS.map(id=>{const a=(S.school[id]||[]).filter(t=>t!==NONE);const o=S.schoolOther[id];const parts=[...a,...(o?[o]:[])];return parts.length||(S.school[id]||[]).includes(NONE)?`${nm(id)}: ${esc(parts.join(", ")||"nenhuma das opções")}`:""}).filter(Boolean).join("<br>")||"—"}</dd>
      <dt>Progresso</dt><dd>${SUBJ_IDS.filter(id=>S.progress[id]).map(id=>nm(id)+" "+starsRow(S.progress[id].stars,18)).join(" · ")||"Nenhum nível completo ainda"}</dd>
    </dl></div>
    <div class="foot"><button class="btn" data-go="casa">← Voltar</button><button class="btn bad" id="reset">Apagar tudo e recomeçar</button></div>`;
  $("#reset").onclick=()=>{modal(`<h2>Apagar todo o progresso?</h2><p>O quiz, as estrelas e os itens da casa serão apagados.</p><div class="row" style="justify-content:center"><button class="btn bad" id="yes">Apagar</button><button class="btn ghost" id="no">Cancelar</button></div>`);$("#no").onclick=closeModal;$("#yes").onclick=()=>{closeModal();S=fresh();save();paisOk=false;pickAv=null;go("start")}};
}

/* ============ BALÕES JUSTOS ============ */
// Quando o texto quebra em várias linhas, a caixa fica com a largura máxima e sobra espaço em branco.
// Aqui medimos a linha mais comprida e ajustamos a largura do balão a ela.
function fitBubbles(){
  document.querySelectorAll(".bubble").forEach(b=>{
    const t=b.querySelector(".tx");if(!t)return;
    b.style.width="";
    const rects=[...t.getClientRects()];if(rects.length<2)return;   // uma linha só: já está justo
    const scale=b.getBoundingClientRect().width/(b.offsetWidth||1)||1; // o balão pode estar no meio do "pulinho"
    const w=(Math.max(...rects.map(r=>r.right))-Math.min(...rects.map(r=>r.left)))/scale;
    const cs=getComputedStyle(b);
    const extra=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight)+parseFloat(cs.borderLeftWidth)+parseFloat(cs.borderRightWidth);
    b.style.width=Math.ceil(w+extra+2)+"px";
  });
}
new MutationObserver(()=>requestAnimationFrame(fitBubbles)).observe(app,{childList:true,subtree:true});
window.addEventListener("resize",()=>requestAnimationFrame(fitBubbles));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitBubbles);

/* ============ GLOBAL CLICKS ============ */
document.addEventListener("click",e=>{
  const t=e.target;
  const sb=t.closest("[data-snd]");
  if(sb){sfxOn=!sfxOn;try{localStorage.setItem(SND_KEY,sfxOn?"1":"0")}catch(err){}
    document.querySelectorAll("[data-snd]").forEach(b=>{b.innerHTML=ic(sfxOn?"snd":"mute",28);b.setAttribute("aria-pressed",sfxOn);b.setAttribute("aria-label",sfxOn?"Desligar os sons":"Ligar os sons")});
    sfx("pop");return}
  // sons dos toques (respostas das lições têm som próprio: acertou/errou)
  if(t.closest(".opt[data-i]")){}
  else if(t.closest("[data-av],[data-sw],#me"))sfx("boing");
  else if(t.closest(".opt[data-v],.chip"))sfx("pick");
  else if(t.closest("button,.lv")&&!t.closest("#splash"))sfx("tap");
  const g=t.closest("[data-go]");if(g){e.preventDefault();const t=g.dataset.go;if(t==="avatar"){pickAv=null}go(t);return}
  const s=e.target.closest("[data-say]");if(s){speak([[s.dataset.say,"pt-BR"]])}
});

go("splash");
</script>
